<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Parkboxd</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14181c">
<meta name="description" content="Log, rate and review every South Park episode, and see what your friends think.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Parkboxd">
<meta property="og:title" content="Parkboxd: track every South Park episode">
<meta property="og:description" content="Log, rate and review every South Park episode, and see what your friends think.">
<meta property="og:image" content="https://parkboxd.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261127172353">
<script type="module" src="js/pages/login.js?v=20261127172353"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="hero small">
    <svg class="hero-mountains" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 320 L0 200 L160 90 L260 170 L420 40 L560 160 L700 70 L860 180 L1000 60 L1150 170 L1300 100 L1440 190 L1440 320 Z" fill="#2c3e52"/>
      <path d="M160 90 L200 118 L180 122 L150 112 Z M420 40 L470 82 L440 78 L410 90 L390 68 Z M700 70 L745 108 L715 104 L690 112 L672 92 Z M1000 60 L1050 104 L1020 100 L995 110 L975 86 Z M1300 100 L1335 128 L1310 126 L1285 116 Z" fill="#eef3f7"/>
      <path d="M0 320 L0 260 L240 220 L520 250 L800 210 L1100 245 L1440 220 L1440 320 Z" fill="#eef3f7"/>
    </svg>
    <div class="wrap hero-inner"><div class="cut hero-tagline">Come on down to South Park</div></div>
  </section>

  <div class="wrap" style="padding-bottom:64px">
    <div class="auth-card paper">
      <div class="tabs" role="tablist" aria-label="Log in or sign up">
        <button type="button" role="tab" id="tab-login" aria-controls="login-form" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-signup" aria-controls="signup-form" aria-selected="false">Sign up</button>
      </div>

      <p class="notice" id="msg" role="status" hidden></p>

      <form class="form" id="login-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1 class="cut">Welcome back</h1>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-green" type="submit">Log in</button>
        <button type="button" class="link-button" id="show-forgot" style="align-self:center;font-size:13px">Forgot your password?</button>
      </form>

      <form class="form" id="forgot-form" novalidate hidden>
        <h1 class="cut">Forgot it?</h1>
        <p class="lead" style="margin:0">Happens to the best of us. Mostly Cartman. Enter your email and we'll send you a link to pick a new one.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" autocomplete="email" required>
        </div>
        <button class="btn btn-green" type="submit">Send reset link</button>
        <button type="button" class="link-button" id="back-to-login" style="align-self:center;font-size:13px">Back to log in</button>
      </form>

      <form class="form" id="signup-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
        <h1 class="cut">Make an account</h1>
        <div class="field">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" autocomplete="username" maxlength="20" spellcheck="false" autocapitalize="off" required aria-describedby="signup-username-hint">
          <span class="hint" id="signup-username-hint">3–20 characters: lowercase letters, numbers, underscores.</span>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" autocomplete="new-password" minlength="8" required aria-describedby="signup-password-hint">
          <span class="hint" id="signup-password-hint">At least 8 characters.</span>
        </div>
        <button class="btn btn-green" type="submit">Sign up</button>
      </form>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episodes · Parkboxd</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261127064518">
<script type="module" src="js/pages/episodes.js?v=20261127064518"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap page">
    <section>
      <div class="section-head"><h2>Episodes</h2><span class="result-count" id="count" aria-live="polite"></span></div>
      <div class="toolbar" style="margin-bottom:20px">
        <label class="visually-hidden" for="q">Search by title</label>
        <input type="search" id="q" placeholder="Search by title or S5E4" autocomplete="off">
        <div class="chips" role="group" aria-label="Show">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-filter="episode" aria-pressed="false">Episodes</button>
          <button type="button" class="chip" data-filter="special" aria-pressed="false">Specials</button>
          <button type="button" class="chip" data-filter="movie" aria-pressed="false">Movies</button>
          <button type="button" class="chip" data-filter="unwatched" aria-pressed="false">Unwatched</button>
        </div>
        <label class="visually-hidden" for="tag">Tag</label>
        <select id="tag"><option value="">Any tag</option></select>
        <label class="visually-hidden" for="sort">Sort by</label>
        <select id="sort">
          <option value="air">Air order</option>
          <option value="newest">Newest first</option>
          <option value="rating">Highest rated</option>
          <option value="popular">Most watched</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
      <div class="chips" id="focus-chips" role="group" aria-label="Episodes about" style="margin:-8px 0 20px"></div>
      <div class="ep-grid" id="grid" aria-busy="true"><p class="empty">Loading…</p></div>
    </section>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
